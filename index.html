<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday Skhanyiso! 🎉</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, pink 0%, purple 100%);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      overflow: hidden;
    }
    .card {
      background: rgba(255, 255, 255, 0.9);
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
      max-width: 500px;
      width: 90%;
      z-index: 10;
      animation: glow 2s infinite alternate;
      position: relative;
    }
    h1 {
      color: #ff4757;
      font-size: 2.4rem;
      margin-bottom: 10px;
    }
    p {
      color: #2f3542;
      font-size: 1.2rem;
      line-height: 1.6;
      margin-bottom: 20px;
    }
    button {
      background-color: #ff4757;
      color: white;
      border: none;
      padding: 12px 25px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 25px;
      cursor: pointer;
      transition: background 0.2s;
      box-shadow: 0 4px 15px rgba(255, 71, 87, 0.4);
    }
    button:hover {
      background-color: #e84118;
    }
    @keyframes glow {
      from { box-shadow: 0 0 10px #ff4757; }
      to { box-shadow: 0 0 20px #ffa502; }
    }

    /* Floating polaroid-style pictures */
    .gallery {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    .gallery img {
      position: absolute;
      width: 160px;   /* enlarged size */
      height: 160px;
      object-fit: cover;
      border: 6px solid white;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.35);
      animation: float 6s infinite ease-in-out;
    }
    .gallery img:nth-child(1) { top: 10%; left: 12%; animation-delay: 0s; }
    .gallery img:nth-child(2) { bottom: 15%; left: 20%; animation-delay: 2s; }
    .gallery img:nth-child(3) { top: 20%; right: 15%; animation-delay: 4s; }
    .gallery img:nth-child(4) { bottom: 25%; right: 10%; animation-delay: 1s; }
    .gallery img:nth-child(5) { top: 35%; left: 5%; animation-delay: 3s; }

    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(-4deg); }
      50% { transform: translateY(-20px) rotate(4deg); }
    }

    /* Confetti animation */
    @keyframes fall {
      to { transform: translateY(105vh) rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Happy Birthday, Skhanyiso! 🎂</h1>
    <p>To my wonderful sister from another mother 💖 — you are a blessing in my life. Your laughter, kindness, and strength inspire me every day. May this year bring you endless joy, success, and all the love you deserve. Happy Birthday! 🎉</p>
    <button onclick="makeItRain(); document.getElementById('birthdaySong').play()">Celebrate! 🎉</button>
  </div>

  <!-- Floating gallery with five pictures -->
  <div class="gallery">
    <img src="WhatsApp.jpeg" alt="Birthday Pic 1">
    <img src="file.jpg" alt="Birthday Pic 2">
    <img src="1785676572184.png" alt="Birthday Pic 3">
    <img src="1785676585807.png" alt="Birthday Pic 4">
    <img src="1785676612998.png" alt="Birthday Pic 5">
  </div>

  <audio id="birthdaySong" src="Samthing_Soweto_-_Happy_Birthday_CeeNaija.com_.mp3"></audio>

  <script>
    function makeItRain() {
      const colors = ['#ff4757', '#2ed573', '#1e90ff', '#ffa502', '#3742fa', '#f53b57'];
      for (let i = 0; i < 80; i++) {
        const confetti = document.createElement('div');
        confetti.style.position = 'absolute';
        confetti.style.width = confetti.style.height = Math.random() * 8 + 6 + 'px';
        confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
        confetti.style.left = Math.random() * 100 + 'vw';
        confetti.style.top = '-10px';
        confetti.style.opacity = Math.random();
        confetti.style.animation = `fall ${Math.random() * 2 + 2}s linear`;
        document.body.appendChild(confetti);
        setTimeout(() => confetti.remove(), 4000);
      }
    }
  </script>
</body>
</html>
