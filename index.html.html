<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Skhanyiso! 🎉</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            /* 🎨 Replace with her favorite colors */
            background: linear-gradient(135deg, pink 0%, purple 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            text-align: center;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            max-width: 500px;
            width: 90%;
            z-index: 10;
            transition: transform 0.3s ease;
            animation: glow 2s infinite alternate;
        }
        .card:hover {
            transform: scale(1.02);
        }
        h1 {
            color: #ff4757;
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        p {
            color: #57606f;
            font-size: 1.1rem;
            line-height: 1.5;
            margin-bottom: 20px;
        }
        button {
            background-color: #ff4757;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            transition: background 0.2s;
            box-shadow: 0 4px 15px rgba(255, 71, 87, 0.4);
        }
        button:hover {
            background-color: #e84118;
        }
        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            background-color: #ffd32a;
            animation: fall 3s linear infinite;
            top: -10px;
        }
        @keyframes fall {
            to {
                transform: translateY(105vh) rotate(360deg);
            }
        }
        @keyframes glow {
            from { box-shadow: 0 0 10px #ff4757; }
            to { box-shadow: 0 0 20px #ffa502; }
        }
        /* 🎆 Animated picture placeholders */
        .pictures {
            display: flex;
            justify-content: space-around;
            margin-top: 20px;
        }
        .pictures img {
            width: 100px;
            height: 100px;
            border-radius: 15px;
            animation: bounce 2s infinite;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Happy Birthday, Skhanyiso! 🎂</h1>
        
        <p>To my wonderful sister from another mother 💖 — you are a blessing in my life. Your laughter, kindness, and strength inspire me every day. May this year bring you endless joy, success, and all the love you deserve. Happy Birthday! 🎉</p>
        
        <button onclick="makeItRain(); document.getElementById('birthdaySong').play()">Celebrate! 🎉</button>
        
        <!-- 🎆 Picture placeholders with animation -->
        <div class="pictures">
            <img src="WhatsApp.jpeg" alt="Birthday Pic 1">
            <img src="file.jpg" alt="Birthday Pic 2">
        </div>
    </div>

    <!-- 🎶 Replace with her favorite song or a birthday tune -->
    <audio id="birthdaySong" src="Samthing_Soweto_-_Happy_Birthday_CeeNaija.com_.mp3"></audio>

    <script>
        function makeItRain() {
            const colors = ['#ff4757', '#2ed573', '#1e90ff', '#ffa502', '#3742fa', '#f53b57'];
            
            for (let i = 0; i < 100; i++) {
                const confetti = document.createElement('div');
                confetti.classList.add('confetti');
                
                // Randomise properties
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.animationDuration = (Math.random() * 2 + 2) + 's'; 
                confetti.style.opacity = Math.random();
                confetti.style.width = confetti.style.height = Math.random() * 8 + 6 + 'px';
                
                document.body.appendChild(confetti);
                
                // Remove confetti after animation loops
                setTimeout(() => {
                    confetti.remove();
                }, 4000);
            }
        }
    </script>
</body>
</html>
